              {
                q: "Hoe zoek je een klant op in Blox?",
                options: [
                  "Alleen op naam",
                  "Eerst op telefoonnummer, anders op straatnaam en telefoonnummer",
                  "Alleen op adres",
                  "Via email"
                ],
                correct: 1
              },
              {
                q: "Wat schrijf je NIET in een Blox memo?",
                options: [
                  "Wat de klant heeft gemeld",
                  "Welke actie je hebt ondernomen",
                  "Persoonlijke mening over de klant",
                  "Wat de volgende stap is"
                ],
                correct: 2
              },
              {
                q: "Wat kan je gebruiken om de schrijfwijze van een straatnaam te vinden?",
                options: [
                  "Notion",
                  "Google",
                  "Teams chat",
                  "De klant vragen"
                ],
                correct: 1
              }
            ]
          }
        },
        {
          id: 7,
          title: "AC Storing Procedure",
          duration: "20 min",
          topics: [
            "Hoe AC storingen binnenkomen",
            "Bon in Blox",
            "Prioriteit en urgent zetten",
            "Juiste dienst taggen"
          ],
          content: `AC STORING PROCEDURE

PROCEDURE STORING:

Storingen worden via de website ingevuld. Er wordt dan een bon aangemaakt in Blox.

OPGELET:
Als het dringend is dient de bon op prio en urgent gezet te worden.

TAG DE JUISTE DIENST:
- Planning
- Storing`,
          quiz: {
            questions: [
              {
                q: "Hoe komen AC storingen binnen?",
                options: [
                  "Telefonisch",
                  "Via de website, er wordt dan een bon aangemaakt in Blox",
                  "Via email",
                  "Via Teams"
                ],
                correct: 1
              },
              {
                q: "Wat doe je als een AC storing dringend is?",
                options: [
                  "Direct bellen",
                  "Bon op prio en urgent zetten",
                  "Alleen urgent zetten",
                  "Alleen prio zetten"
                ],
                correct: 1
              },
              {
                q: "Welke diensten kan je taggen bij AC storingen?",
                options: [
                  "PV Planning en PV Storing",
                  "Planning en Storing",
                  "Facturatie en Planning",
                  "Sam en Leandro"
                ],
                correct: 1
              }
            ]
          }
        }
      ];

      const totalModules = modules.length;
      const completedModules = Object.keys(progress).filter(k => progress[k].completed).length;
      const progressPercentage = Math.round((completedModules / totalModules) * 100);
      const totalDuration = modules.reduce((acc, m) => {
        const mins = parseInt(m.duration);
        return acc + mins;
      }, 0);

      const completeModule = (moduleId) => {
        setProgress(prev => ({
          ...prev,
          [moduleId]: {
            completed: true,
            completedAt: new Date().toISOString(),
            quizScore: quizAnswers[moduleId] || 0
          }
        }));
        setExpandedModule(null);
        setCurrentQuiz(null);
        setQuizAnswers({});
      };

      const startQuiz = (moduleId) => {
        setCurrentQuiz(moduleId);
        setQuizAnswers({});
      };

      const submitQuiz = (moduleId) => {
        const module = modules.find(m => m.id === moduleId);
        const correctAnswers = module.quiz.questions.filter(
          (q, idx) => quizAnswers[idx] === q.correct
        ).length;
        
        const score = Math.round((correctAnswers / module.quiz.questions.length) * 100);
        
        if (score >= 70) {
          // Send to Google Sheets
          sendToGoogleSheets(moduleId, score, module.title);
          
          completeModule(moduleId);
        } else {
          alert(`Je hebt ${score}% correct. Je hebt minimaal 70% nodig. Probeer het nog eens!`);
          setQuizAnswers({});
        }
      };

      return (
        <div style={{
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)',
          padding: '2rem',
          fontFamily: '"DM Sans", -apple-system, BlinkMacSystemFont, sans-serif'
        }}>
          {showNameInput ? (
            // Name Input Screen
            <div style={{
              maxWidth: '500px',
              margin: '10rem auto',
              textAlign: 'center'
            }}>
              <Award size={64} color="#22c55e" style={{ marginBottom: '2rem' }} />
              <h1 style={{
                fontSize: '2.5rem',
                fontWeight: '800',
                color: '#ffffff',
                marginBottom: '1rem'
              }}>
                Welkom bij de FavorCool Academy
              </h1>
              <p style={{
                fontSize: '1.125rem',
                color: '#94a3b8',
                marginBottom: '3rem'
              }}>
                Voordat je begint, vul je naam in zodat we je voortgang kunnen volgen.
              </p>
              
              <input
                type="text"
                value={userName}
                onChange={(e) => setUserName(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && handleNameSubmit()}
                placeholder="Je volledige naam"
                style={{
                  width: '100%',
                  padding: '1rem 1.5rem',
                  fontSize: '1.125rem',
                  borderRadius: '0.75rem',
                  border: '2px solid rgba(255, 255, 255, 0.1)',
                  background: 'rgba(255, 255, 255, 0.05)',
                  color: '#ffffff',
                  marginBottom: '1.5rem',
                  outline: 'none',
                  transition: 'border 0.2s'
                }}
                onFocus={(e) => e.target.style.borderColor = 'rgba(34, 197, 94, 0.5)'}
                onBlur={(e) => e.target.style.borderColor = 'rgba(255, 255, 255, 0.1)'}
              />
              
              <button
                onClick={handleNameSubmit}
                disabled={!userName.trim()}
                style={{
                  width: '100%',
                  padding: '1rem 2rem',
                  fontSize: '1.125rem',
                  fontWeight: '600',
                  borderRadius: '0.75rem',
                  border: 'none',
                  background: userName.trim() 
                    ? 'linear-gradient(135deg, #22c55e 0%, #10b981 100%)'
                    : 'rgba(255, 255, 255, 0.1)',
                  color: '#ffffff',
                  cursor: userName.trim() ? 'pointer' : 'not-allowed',
                  transition: 'transform 0.2s',
                  opacity: userName.trim() ? 1 : 0.5
                }}
                onMouseOver={e => userName.trim() && (e.target.style.transform = 'scale(1.02)')}
                onMouseOut={e => e.target.style.transform = 'scale(1)'}
              >
                Start Training →
              </button>
            </div>
          ) : (
            // Main Learning Path
            <>
          {/* Header */}
          <div style={{
            maxWidth: '1200px',
            margin: '0 auto 3rem',
            textAlign: 'center'
          }}>
            <div style={{
              display: 'inline-flex',
              alignItems: 'center',
              gap: '0.75rem',
              background: 'rgba(34, 197, 94, 0.1)',
              border: '1px solid rgba(34, 197, 94, 0.3)',
              borderRadius: '2rem',
              padding: '0.5rem 1.5rem',
              marginBottom: '1.5rem'
            }}>
              <Award size={20} color="#22c55e" />
              <span style={{ color: '#22c55e', fontSize: '0.875rem', fontWeight: '600' }}>
                FavorCool Inbound Academy
              </span>
            </div>
            
            <h1 style={{
              fontSize: '3rem',
              fontWeight: '800',
              background: 'linear-gradient(135deg, #ffffff 0%, #94a3b8 100%)',
              WebkitBackgroundClip: 'text',
              WebkitTextFillColor: 'transparent',
              marginBottom: '1rem',
              letterSpacing: '-0.02em'
            }}>
              Inbound Learning Path
            </h1>
            
            <p style={{
              fontSize: '1.125rem',
              color: '#94a3b8',
              maxWidth: '600px',
              margin: '0 auto'
            }}>
              Van beginner tot expert in {Math.round(totalDuration / 60)} uur training
            </p>
            <p style={{
              fontSize: '0.875rem',
              color: '#64748b',
              marginTop: '0.5rem'
            }}>
              Ingelogd als: {userName}
            </p>
          </div>

          {/* Progress Overview */}
          <div style={{
            maxWidth: '1200px',
            margin: '0 auto 3rem',
            background: 'rgba(255, 255, 255, 0.05)',
            backdropFilter: 'blur(10px)',
            borderRadius: '1.5rem',
            padding: '2rem',
            border: '1px solid rgba(255, 255, 255, 0.1)'
          }}>
            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              marginBottom: '1.5rem'
            }}>
              <div>
                <h2 style={{
                  fontSize: '1.5rem',
                  fontWeight: '700',
                  color: '#ffffff',
                  marginBottom: '0.5rem'
                }}>
                  Jouw Voortgang
                </h2>
                <p style={{ color: '#94a3b8', fontSize: '0.875rem' }}>
                  {completedModules} van {totalModules} modules voltooid
                </p>
              </div>
              <div style={{
                fontSize: '3rem',
                fontWeight: '800',
                color: '#22c55e'
              }}>
                {progressPercentage}%
              </div>
            </div>

            {/* Progress Bar */}
            <div style={{
              width: '100%',
              height: '12px',
              background: 'rgba(255, 255, 255, 0.1)',
              borderRadius: '1rem',
              overflow: 'hidden',
              position: 'relative'
            }}>
              <div style={{
                width: `${progressPercentage}%`,
                height: '100%',
                background: 'linear-gradient(90deg, #22c55e 0%, #10b981 100%)',
                borderRadius: '1rem',
                transition: 'width 0.6s cubic-bezier(0.4, 0, 0.2, 1)',
                boxShadow: '0 0 20px rgba(34, 197, 94, 0.5)'
              }} />
            </div>

            {/* Stats */}
            <div style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(3, 1fr)',
              gap: '1rem',
              marginTop: '1.5rem'
            }}>
              <div style={{
                background: 'rgba(255, 255, 255, 0.05)',
                borderRadius: '1rem',
                padding: '1rem',
                textAlign: 'center'
              }}>
                <Clock size={24} color="#60a5fa" style={{ marginBottom: '0.5rem' }} />
                <div style={{ fontSize: '1.5rem', fontWeight: '700', color: '#ffffff' }}>
                  {totalDuration} min
                </div>
                <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Totale Tijd</div>
              </div>
              <div style={{
                background: 'rgba(255, 255, 255, 0.05)',
                borderRadius: '1rem',
                padding: '1rem',
                textAlign: 'center'
              }}>
                <BookOpen size={24} color="#f59e0b" style={{ marginBottom: '0.5rem' }} />
                <div style={{ fontSize: '1.5rem', fontWeight: '700', color: '#ffffff' }}>
                  {totalModules}
                </div>
                <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Modules</div>
              </div>
              <div style={{
                background: 'rgba(255, 255, 255, 0.05)',
                borderRadius: '1rem',
                padding: '1rem',
                textAlign: 'center'
              }}>
                <CheckCircle size={24} color="#22c55e" style={{ marginBottom: '0.5rem' }} />
                <div style={{ fontSize: '1.5rem', fontWeight: '700', color: '#ffffff' }}>
                  {completedModules}
                </div>
                <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Voltooid</div>
              </div>
            </div>
          </div>

          {/* Modules Timeline */}
          <div style={{
            maxWidth: '1200px',
            margin: '0 auto'
          }}>
            {modules.map((module, idx) => {
              const isCompleted = progress[module.id]?.completed;
              const isExpanded = expandedModule === module.id;
              const isQuizActive = currentQuiz === module.id;
              const canStart = idx === 0 || progress[modules[idx - 1].id]?.completed;

              return (
                <div key={module.id} style={{
                  position: 'relative',
                  marginBottom: '2rem'
                }}>
                  {/* Timeline connector */}
                  {idx < modules.length - 1 && (
                    <div style={{
                      position: 'absolute',
                      left: '2rem',
                      top: '5rem',
                      width: '2px',
                      height: 'calc(100% + 2rem)',
                      background: isCompleted 
                        ? 'linear-gradient(180deg, #22c55e 0%, rgba(34, 197, 94, 0.3) 100%)'
                        : 'rgba(255, 255, 255, 0.1)',
                      transition: 'background 0.3s'
                    }} />
                  )}

                  {/* Module Card */}
                  <div style={{
                    background: isCompleted 
                      ? 'linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(34, 197, 94, 0.05) 100%)'
                      : 'rgba(255, 255, 255, 0.05)',
                    backdropFilter: 'blur(10px)',
                    borderRadius: '1.5rem',
                    border: isCompleted 
                      ? '1px solid rgba(34, 197, 94, 0.3)'
                      : '1px solid rgba(255, 255, 255, 0.1)',
                    overflow: 'hidden',
                    transition: 'all 0.3s',
                    opacity: canStart ? 1 : 0.6
                  }}>
                    {/* Module Header */}
                    <div
                      onClick={() => canStart && setExpandedModule(isExpanded ? null : module.id)}
                      style={{
                        padding: '2rem',
                        cursor: canStart ? 'pointer' : 'not-allowed',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '1.5rem'
                      }}
                    >
                      {/* Status Icon */}
                      <div style={{
                        flexShrink: 0,
                        width: '4rem',
                        height: '4rem',
                        borderRadius: '50%',
                        background: isCompleted
                          ? 'linear-gradient(135deg, #22c55e 0%, #10b981 100%)'
                          : 'rgba(255, 255, 255, 0.1)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        position: 'relative',
                        zIndex: 1
                      }}>
                        {isCompleted ? (
                          <CheckCircle size={28} color="#ffffff" />
                        ) : (
                          <Circle size={28} color="#94a3b8" />
                        )}
                      </div>

                      {/* Module Info */}
                      <div style={{ flex: 1 }}>
                        <div style={{
                          display: 'flex',
                          alignItems: 'center',
                          gap: '1rem',
                          marginBottom: '0.5rem'
                        }}>
                          <span style={{
                            fontSize: '0.875rem',
                            fontWeight: '600',
                            color: '#60a5fa',
                            background: 'rgba(96, 165, 250, 0.1)',
                            padding: '0.25rem 0.75rem',
                            borderRadius: '0.5rem'
                          }}>
                            Module {module.id}
                          </span>
                          <span style={{
                            fontSize: '0.875rem',
                            color: '#94a3b8',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '0.25rem'
                          }}>
                            <Clock size={14} />
                            {module.duration}
                          </span>
                        </div>
                        <h3 style={{
                          fontSize: '1.5rem',
                          fontWeight: '700',
                          color: '#ffffff',
                          marginBottom: '0.75rem'
                        }}>
                          {module.title}
                        </h3>
                        <div style={{
                          display: 'flex',
                          flexWrap: 'wrap',
                          gap: '0.5rem'
                        }}>
                          {module.topics.map((topic, i) => (
                            <span key={i} style={{
                              fontSize: '0.75rem',
                              color: '#94a3b8',
                              background: 'rgba(255, 255, 255, 0.05)',
                              padding: '0.25rem 0.75rem',
                              borderRadius: '0.5rem'
                            }}>
                              {topic}
                            </span>
                          ))}
                        </div>
                      </div>

                      {/* Expand Icon */}
                      {canStart && (
                        <div>
                          {isExpanded ? (
                            <ChevronDown size={24} color="#94a3b8" />
                          ) : (
                            <ChevronRight size={24} color="#94a3b8" />
                          )}
                        </div>
                      )}
                    </div>

                    {/* Expanded Content */}
                    {isExpanded && (
                      <div style={{
                        padding: '0 2rem 2rem',
                        animation: 'slideDown 0.3s ease-out'
                      }}>
                        {!isQuizActive ? (
                          <>
                            <div style={{
                              background: 'rgba(0, 0, 0, 0.2)',
                              borderRadius: '1rem',
                              padding: '2rem',
                              marginBottom: '1.5rem',
                              whiteSpace: 'pre-line',
                              lineHeight: '1.8',
                              color: '#e2e8f0',
                              fontSize: '0.9375rem'
                            }}>
                              {module.content}
                            </div>
                            <button
                              onClick={() => startQuiz(module.id)}
                              style={{
                                background: 'linear-gradient(135deg, #22c55e 0%, #10b981 100%)',
                                color: '#ffffff',
                                border: 'none',
                                borderRadius: '0.75rem',
                                padding: '1rem 2rem',
                                fontSize: '1rem',
                                fontWeight: '600',
                                cursor: 'pointer',
                                width: '100%',
                                transition: 'transform 0.2s',
                                boxShadow: '0 10px 30px rgba(34, 197, 94, 0.3)'
                              }}
                              onMouseOver={e => e.target.style.transform = 'scale(1.02)'}
                              onMouseOut={e => e.target.style.transform = 'scale(1)'}
                            >
                              Start Quiz →
                            </button>
                          </>
                        ) : (
                          <div>
                            <h4 style={{
                              fontSize: '1.25rem',
                              fontWeight: '700',
                              color: '#ffffff',
                              marginBottom: '1.5rem'
                            }}>
                              Quick Quiz - {module.title}
                            </h4>
                            {module.quiz.questions.map((question, qIdx) => (
                              <div key={qIdx} style={{
                                background: 'rgba(0, 0, 0, 0.2)',
                                borderRadius: '1rem',
                                padding: '1.5rem',
                                marginBottom: '1rem'
                              }}>
                                <p style={{
                                  color: '#ffffff',
                                  fontWeight: '600',
                                  marginBottom: '1rem'
                                }}>
                                  {qIdx + 1}. {question.q}
                                </p>
                                {question.options.map((option, oIdx) => (
                                  <label key={oIdx} style={{
                                    display: 'block',
                                    padding: '0.75rem',
                                    marginBottom: '0.5rem',
                                    background: quizAnswers[qIdx] === oIdx
                                      ? 'rgba(34, 197, 94, 0.2)'
                                      : 'rgba(255, 255, 255, 0.05)',
                                    borderRadius: '0.5rem',
                                    cursor: 'pointer',
                                    border: '1px solid ' + (quizAnswers[qIdx] === oIdx
                                      ? 'rgba(34, 197, 94, 0.5)'
                                      : 'transparent'),
                                    transition: 'all 0.2s'
                                  }}>
                                    <input
                                      type="radio"
                                      name={`q${qIdx}`}
                                      checked={quizAnswers[qIdx] === oIdx}
                                      onChange={() => setQuizAnswers(prev => ({ ...prev, [qIdx]: oIdx }))}
                                      style={{ marginRight: '0.75rem' }}
                                    />
                                    <span style={{ color: '#e2e8f0' }}>{option}</span>
                                  </label>
                                ))}
                              </div>
                            ))}
                            <div style={{
                              display: 'flex',
                              gap: '1rem'
                            }}>
                              <button
                                onClick={() => submitQuiz(module.id)}
                                disabled={Object.keys(quizAnswers).length !== module.quiz.questions.length}
                                style={{
                                  flex: 1,
                                  background: Object.keys(quizAnswers).length === module.quiz.questions.length
                                    ? 'linear-gradient(135deg, #22c55e 0%, #10b981 100%)'
                                    : 'rgba(255, 255, 255, 0.1)',
                                  color: '#ffffff',
                                  border: 'none',
                                  borderRadius: '0.75rem',
                                  padding: '1rem',
                                  fontSize: '1rem',
                                  fontWeight: '600',
                                  cursor: Object.keys(quizAnswers).length === module.quiz.questions.length 
                                    ? 'pointer' 
                                    : 'not-allowed',
                                  opacity: Object.keys(quizAnswers).length === module.quiz.questions.length ? 1 : 0.5
                                }}
                              >
                                Submit Quiz
                              </button>
                              <button
                                onClick={() => setCurrentQuiz(null)}
                                style={{
                                  background: 'rgba(255, 255, 255, 0.1)',
                                  color: '#94a3b8',
                                  border: 'none',
                                  borderRadius: '0.75rem',
                                  padding: '1rem 1.5rem',
                                  fontSize: '1rem',
                                  fontWeight: '600',
                                  cursor: 'pointer'
                                }}
                              >
                                Terug
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Completion Badge */}
          {progressPercentage === 100 && (
            <div style={{
              maxWidth: '1200px',
              margin: '3rem auto',
              background: 'linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(34, 197, 94, 0.1) 100%)',
              border: '2px solid rgba(34, 197, 94, 0.5)',
              borderRadius: '1.5rem',
              padding: '3rem',
              textAlign: 'center'
            }}>
              <Award size={64} color="#22c55e" style={{ marginBottom: '1rem' }} />
              <h2 style={{
                fontSize: '2rem',
                fontWeight: '800',
                color: '#ffffff',
                marginBottom: '0.5rem'
              }}>
                Gefeliciteerd! 🎉
              </h2>
              <p style={{
                fontSize: '1.125rem',
                color: '#94a3b8'
              }}>
                Je hebt de FavorCool Inbound Learning Path succesvol afgerond!
              </p>
            </div>
          )}
            </>
          )}
        </div>
      );
    };

    ReactDOM.render(<LearningPath />, document.getElementById('root'));
  </script>
</body>
</html>
