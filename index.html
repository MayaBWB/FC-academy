<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FavorCool Inbound Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; font-family: 'DM Sans', sans-serif; }
    #root { min-height: 100vh; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CheckCircle = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    );

    const Circle = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
        <circle cx="12" cy="12" r="10"></circle>
      </svg>
    );

    const Award = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
        <circle cx="12" cy="8" r="7"></circle>
        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
      </svg>
    );

    const Clock = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    );

    const BookOpen = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
    );

    const ChevronDown = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    );

    const ChevronRight = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    );

    const LearningPath = () => {
      const [progress, setProgress] = useState({});
      const [expandedModule, setExpandedModule] = useState(null);
      const [currentQuiz, setCurrentQuiz] = useState(null);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [userName, setUserName] = useState('');
      const [showNameInput, setShowNameInput] = useState(true);

      useEffect(() => {
        const saved = localStorage.getItem('fc-learning-progress');
        if (saved) setProgress(JSON.parse(saved));
        
        const savedName = localStorage.getItem('fc-user-name');
        if (savedName) {
          setUserName(savedName);
          setShowNameInput(false);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('fc-learning-progress', JSON.stringify(progress));
      }, [progress]);

      const handleNameSubmit = () => {
        if (userName.trim()) {
          localStorage.setItem('fc-user-name', userName);
          setShowNameInput(false);
        }
      };

      const sendToGoogleSheets = async (moduleId, score, moduleName) => {
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxls-dqkS6rjT5iR1Pwbt2z-50_CU--NmNB3J5RVhNVSE2pQ-fQcnxJrSlVpUy-vP08Q/exec';
        
        const data = {
          timestamp: new Date().toISOString(),
          naam: userName,
          module: moduleName,
          moduleId: moduleId,
          score: score,
          voltooiingDatum: new Date().toLocaleDateString('nl-NL')
        };

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
          });
          console.log('Resultaten verzonden naar Google Sheets');
        } catch (error) {
          console.error('Fout bij verzenden naar Google Sheets:', error);
        }
      };

      const modules = [
        {
          id: 1,
          title: "Callflow",
          duration: "15 min",
          topics: ["Stappen in de callflow", "AC en PV", "Memo regel", "SOS-criteria"],
          content: `STAPPEN IN DE CALLFLOW

Volg deze stappen bij elke call:

1. Wie heb ik aan de lijn? → Noteer naam in Telforce
2. Wat is de vraag? → Noteer vraag in Telforce  
3. Definieer de dienst: AC of PV of intern?
   - AC → planning of storing?
   - PV → planning of storing?
4. Waar in de klantreis? 🟡 Geel (lead) | 🟢 Groen (klant/installatie) | 🔵 Blauw (storing of onderhoud)?
5. Doel: Achterhaal aan wie door te geven (memo-tag, Teams-groepschat, of directe afhandeling)

2 HOOFDAFDELINGEN
- AC: Airco → memo naar Planning of Storing
- PV: Thuisbatterij, laadpaal, zonnepanelen → memo naar PV Planning of PV Storing

MEMO REGEL
- Vóór installatie → Planning (of PV Planning)
- Ná installatie → Storing (of PV Storing)

⚠️ We verbinden niet meer door. Elke call wordt afgehandeld via een memo in Blox met de juiste tag, of via de Teams-groepschat Storingen.

SOS-CRITERIA
Een melding is SOS wanneer:
- De klant al 2 of 3 keer heeft gebeld voor hetzelfde probleem
- Het probleem al 2 tot 3 weken aansleept zonder oplossing
- De klant boos belt en een concrete oplossing eist

Actie bij SOS: meld dit aan de supervisor via Teams. De supervisor stuurt door naar Leandro of Sam.`,
          quiz: {
            questions: [
              { q: "Wat is de memo regel?", options: ["Altijd naar Planning", "Vóór installatie → Planning, Ná installatie → Storing", "Altijd naar Storing", "Alleen bij urgente zaken"], correct: 1 },
              { q: "Wanneer is een melding SOS?", options: ["Als de klant ongerust is", "Als de klant boos is en al 2-3x belde voor hetzelfde probleem", "Als het technisch complex is", "Als het een nieuwe klant is"], correct: 1 },
              { q: "Wat doe je bij een SOS situatie?", options: ["Direct naar Sam/Leandro", "Melden aan supervisor via Teams, supervisor stuurt door naar Leandro/Sam", "Zelf oplossen", "Afspraak inplannen"], correct: 1 }
            ]
          }
        },
        {
          id: 2,
          title: "Reis van de Klant",
          duration: "15 min",
          topics: ["Relatie, Project, Werkbonnen", "Meerdere producten", "Statusflow"],
          content: `FLOW: VAN LEAD NAAR VOLTOOIDE INSTALLATIE

Alles vertrekt vanuit één Relatie in Blox. Die Relatie wordt aangemaakt zodra de lead binnenkomt, en blijft bestaan zolang de klant bij FavorCool klant is.

STRUCTUUR IN BLOX
Onder één Relatie hangen alle Projecten en Werkbonnen van deze klant.

⚠️ LET OP: Sommige klanten staan helaas dubbel in het systeem. Dit zorgt soms voor verwarring en is eigenlijk niet de bedoeling. Let hier op - als je een werkbon niet terug vindt, kan het in een andere relatie van diezelfde klant terecht zijn gekomen.

VOORBEELD:
Iemand koopt eerst zonnepanelen en anderhalf jaar later een airco:
- Project ZP (afgerond)
  - Werkbon installatie ZP (voltooid)
  - Werkbon onderhoud ZP (periodiek)
  - Werkbon storing ZP (bij defect)
- Project AC (lopend)
  - Werkbon installatie AC (gepland)
  - Werkbon onderhoud AC (na installatie)

KORT SAMENGEVAT:
- Relatie = de klant zelf
- Project = pre-sale traject voor één product  
- Werkbonnen = concrete uitvoeringstaken (installatie, onderhoud, storing) per product`,
          quiz: {
            questions: [
              { q: "Wat is een Relatie in Blox?", options: ["Een project", "De klant zelf", "Een werkbon", "Een product"], correct: 1 },
              { q: "Wat is een Project in Blox?", options: ["De klant", "Pre-sale traject voor één product", "Een storing", "Een afspraak"], correct: 1 },
              { q: "Een klant heeft zonnepanelen én airco. Hoeveel Relaties?", options: ["2 (één per product)", "1 (alle producten hangen onder dezelfde Relatie)", "Hangt af van wanneer gekocht", "3"], correct: 1 }
            ]
          }
        },
        {
          id: 3,
          title: "Hoe Werkt een PV Installatie",
          duration: "15 min",
          topics: ["Energieflow", "Omvormer", "App-problemen", "Slim laden"],
          content: `DE FLOW VAN ENERGIE

1. Zonnepanelen — vangen zonlicht op en zetten het om in gelijkstroom (DC)
2. Omvormer — zet DC om naar wisselstroom (AC) zodat je het thuis kan gebruiken
3. Verbruikers — je apparaten gebruiken de opgewekte stroom als eerste
4. Thuisbatterij — slaat overtollige stroom op voor later gebruik
5. Netstroom — wordt pas gebruikt als de batterij leeg is

Geen zon = geen opwekking. 's Nachts of bij bewolking werkt de batterij of het net.

VEELVOORKOMENDE APP-PROBLEMEN
- App toont "offline" terwijl het systeem werkt → wifi-verbinding verbroken
- Lege vlakken in grafieken → systeem was tijdelijk offline
- App werkt niet meer na provider- of routerwissel → wifi-module moet opnieuw gekoppeld worden

De app is verbonden via wifi. Geen wifi = geen data in de app, maar de installatie kan nog steeds werken.

SLIM LADEN
De batterijen die FavorCool plaatst hebben AI-sturing:
- Laden automatisch op wanneer energie goedkoop is`,
          quiz: {
            questions: [
              { q: "Wat doet de omvormer?", options: ["Vangt zonlicht op", "Zet DC om naar AC zodat je het thuis kan gebruiken", "Slaat energie op", "Verdeelt stroom"], correct: 1 },
              { q: "Waarom toont de app soms 'offline' terwijl het systeem wel werkt?", options: ["De omvormer is kapot", "Wifi-verbinding is verbroken", "De batterij is leeg", "Er is geen zon"], correct: 1 },
              { q: "Wat gebeurt er 's nachts als er geen zon is?", options: ["Het systeem werkt niet", "De batterij werkt of het net wordt gebruikt", "Alleen het net wordt gebruikt", "De omvormer schakelt uit"], correct: 1 }
            ]
          }
        },
        {
          id: 4,
          title: "Gesprekstechniek",
          duration: "15 min",
          topics: ["Opening", "Luisteren", "Vragen stellen", "Boze klanten"],
          content: `HET PERFECTE KLANTGESPREK

1. OPENING
- Begroeting + naam + FavorCool
- "Waarmee kan ik u helpen?"
- Laat klant het verhaal doen

2. LUISTEREN & EMPATHIE
- Toon begrip: "Ik begrijp dat dit vervelend is"
- Noteer belangrijke details in Blox

3. DE JUISTE VRAGEN STELLEN
- Wat zie je precies gebeuren?
- Sinds wanneer speelt dit?
- Heb je al iets geprobeerd?
- Welke foutcode zie je?

4. ACTIE BEPALEN
- Kan ik dit zelf oplossen? → Doe het en documenteer
- Moet dit geëscaleerd worden? → Escaleer via Inbound teamschat naar supervisor
- Is er een afspraak nodig? → Plan in en bevestig

5. AFSLUITING
- Vat samen wat er afgesproken is
- Geef heldere verwachtingen

OMGAAN MET BOZE KLANTEN:
1. LUISTER
2. ERKEN de frustratie: "Ik begrijp dat dit heel vervelend voor u is"
3. NEEM HET NIET PERSOONLIJK
4. ZOEK OPLOSSING, geen schuld
5. Als het uit de hand loopt → escaleer naar supervisor via Inbound teamschat

Zinnen die helpen:
- "Ik snap dat dit frustrerend is"
- "Laten we samen kijken hoe we dit kunnen oplossen"

Zinnen om te VERMIJDEN:
- "Dat is niet mijn schuld"
- "U moet even rustig blijven"`,
          quiz: {
            questions: [
              { q: "Wat doe je als eerste bij een boze klant?", options: ["Uitleggen dat het niet jouw schuld is", "Luisteren zonder te onderbreken en empathie tonen", "Direct escaleren", "Snel een oplossing bieden"], correct: 1 },
              { q: "Naar wie escaleer je als het gesprek uit de hand loopt?", options: ["Sam en Leandro", "Direct naar de manager", "Supervisor via Inbound teamschat", "Facturatie afdeling"], correct: 2 },
              { q: "Welke zin moet je VERMIJDEN bij een boze klant?", options: ["Ik begrijp dat dit vervelend is", "Laten we samen kijken hoe we dit oplossen", "Dat is niet mijn schuld", "Ik zorg dat dit prioriteit krijgt"], correct: 2 }
            ]
          }
        },
        {
          id: 5,
          title: "Overzicht per Calltype",
          duration: "15 min",
          topics: ["Type 1: Offline", "Type 2: Klein technisch", "Type 3: Ernstig", "Klacht"],
          content: `TYPE 1 – OFFLINE / APP PROBLEEM
Actie: SERVICE WIFI BON aanmaken
Tag: @PVStoring

TYPE 2 – KLEINE TECHNISCHE ISSUES  
Actie: Memo aanmaken op de relatie (geen bon)
Tag: @PVStoring

TYPE 3 – ERNSTIGE STORING ⚠️
Actie: FOLLOW-UP BON aanmaken
Tag: @PVStoring
Foto's via: pvstoring@favorcool.be
🔴 SOS als: 2+ meldingen of 2–3 weken zonder oplossing

KLACHT / BOZE KLANT ⚠️
Actie: Memo op relatie + klanthistoriek nakijken
Tag: Groepschat 'Storingen' in Teams
🔴 SOS mogelijk

MONITORING APP
Tag: @PVStoring

INSTALLATIE / PLANNING PV
Tag: planning PV

FACTURATIE / ADMIN
Tag: Sanne`,
          quiz: {
            questions: [
              { q: "Bij welk type storing maak je een SERVICE WIFI BON aan?", options: ["Type 3", "Type 1 - Offline / app probleem", "Type 2", "Klacht"], correct: 1 },
              { q: "Bij Type 2 (kleine technische issues), maak je een bon aan?", options: ["Ja, altijd", "Nee, alleen een memo op de relatie", "Alleen bij urgentie", "Alleen als klant vraagt"], correct: 1 },
              { q: "Waar kunnen klanten foto's van ernstige storingen naartoe sturen?", options: ["WhatsApp", "pvstoring@favorcool.be", "Direct naar Sam", "Via de app"], correct: 1 }
            ]
          }
        },
        {
          id: 6,
          title: "Blox Procedures",
          duration: "15 min",
          topics: ["Klant opzoeken", "Memo aanmaken", "Documentatie"],
          content: `WERKEN MET BLOX

KLANT OPZOEKEN
Zoek eerst op telefoonnummer, anders op straatnaam en telefoonnummer.
Google kan je helpen bij de schrijfwijze van de straatnaam.

NIEUWE MEMO AANMAKEN
- Klik op "Nieuwe memo"
- Titel: kort maar duidelijk (bijv. "Storing omvormer - geen productie")
- Beschrijving: gedetailleerd wat er aan de hand is

WAT SCHRIJF JE IN DE MEMO?
- Wat de klant heeft gemeld
- Wat je hebt gevonden of gecontroleerd
- Welke actie je hebt ondernomen
- Wat de volgende stap is

VOORBEELD GOEDE MEMO:
"Klant meldt geen productie zonnepanelen sinds 2 dagen. Foutcode 24 zichtbaar op Growatt omvormer display. Klant gevraagd omvormer te herstarten - geen verbetering. Escalatie naar supervisor via teamschat. Klant verwacht terugbel binnen 24 uur."

DO:
- Wees specifiek en helder
- Gebruik volledige zinnen
- Documenteer alles wat relevant is

DON'T:
- Geen persoonlijke meningen over klanten
- Niet te summier
- Geen onduidelijke afkortingen`,
          quiz: {
            questions: [
              { q: "Hoe zoek je een klant op in Blox?", options: ["Alleen op naam", "Eerst op telefoonnummer, anders op straatnaam en telefoonnummer", "Alleen op adres", "Via email"], correct: 1 },
              { q: "Wat schrijf je NIET in een Blox memo?", options: ["Wat de klant heeft gemeld", "Welke actie je hebt ondernomen", "Persoonlijke mening over de klant", "Wat de volgende stap is"], correct: 2 },
              { q: "Wat kan je gebruiken om de schrijfwijze van een straatnaam te vinden?", options: ["Notion", "Google", "Teams chat", "De klant vragen"], correct: 1 }
            ]
          }
        },
        {
          id: 7,
          title: "AC Storing Procedure",
          duration: "15 min",
          topics: ["Website intake", "Bon in Blox", "Prioriteit", "Taggen"],
          content: `AC STORING PROCEDURE

PROCEDURE:
Storingen worden via de website ingevuld. Er wordt dan een bon aangemaakt in Blox.

OPGELET:
Als het dringend is dient de bon op prio en urgent gezet te worden.

TAG DE JUISTE DIENST:
- Planning
- Storing`,
          quiz: {
            questions: [
              { q: "Hoe komen AC storingen binnen?", options: ["Telefonisch", "Via de website, er wordt dan een bon aangemaakt in Blox", "Via email", "Via Teams"], correct: 1 },
              { q: "Wat doe je als een AC storing dringend is?", options: ["Direct bellen", "Bon op prio en urgent zetten", "Alleen urgent zetten", "Alleen prio zetten"], correct: 1 },
              { q: "Welke diensten kan je taggen bij AC storingen?", options: ["PV Planning en PV Storing", "Planning en Storing", "Facturatie en Planning", "Sam en Leandro"], correct: 1 }
            ]
          }
        }
      ];

      const totalModules = modules.length;
      const completedModules = Object.keys(progress).filter(k => progress[k].completed).length;
      const progressPercentage = Math.round((completedModules / totalModules) * 100);
      const totalDuration = modules.reduce((acc, m) => acc + parseInt(m.duration), 0);

      const completeModule = (moduleId) => {
        setProgress(prev => ({
          ...prev,
          [moduleId]: { completed: true, completedAt: new Date().toISOString() }
        }));
        setExpandedModule(null);
        setCurrentQuiz(null);
        setQuizAnswers({});
      };

      const submitQuiz = (moduleId) => {
        const module = modules.find(m => m.id === moduleId);
        const correct = module.quiz.questions.filter((q, idx) => quizAnswers[idx] === q.correct).length;
        const score = Math.round((correct / module.quiz.questions.length) * 100);
        
        if (score >= 70) {
          sendToGoogleSheets(moduleId, score, module.title);
          completeModule(moduleId);
        } else {
          alert(`Je hebt ${score}% correct. Je hebt minimaal 70% nodig. Probeer het nog eens!`);
          setQuizAnswers({});
        }
      };

      const styles = {
        container: {
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)',
          padding: '2rem',
          fontFamily: '"DM Sans", sans-serif'
        },
        nameScreen: {
          maxWidth: '500px',
          margin: '10rem auto',
          textAlign: 'center'
        },
        input: {
          width: '100%',
          padding: '1rem 1.5rem',
          fontSize: '1.125rem',
          borderRadius: '0.75rem',
          border: '2px solid rgba(255, 255, 255, 0.1)',
          background: 'rgba(255, 255, 255, 0.05)',
          color: '#ffffff',
          marginBottom: '1.5rem',
          outline: 'none'
        },
        button: {
          width: '100%',
          padding: '1rem 2rem',
          fontSize: '1.125rem',
          fontWeight: '600',
          borderRadius: '0.75rem',
          border: 'none',
          color: '#ffffff',
          cursor: 'pointer'
        }
      };

      if (showNameInput) {
        return (
          <div style={styles.container}>
            <div style={styles.nameScreen}>
              <Award size={64} color="#22c55e" style={{ marginBottom: '2rem' }} />
              <h1 style={{ fontSize: '2.5rem', fontWeight: '800', color: '#ffffff', marginBottom: '1rem' }}>
                Welkom bij FavorCool Academy
              </h1>
              <p style={{ fontSize: '1.125rem', color: '#94a3b8', marginBottom: '3rem' }}>
                Vul je naam in om te beginnen
              </p>
              <input
                type="text"
                value={userName}
                onChange={(e) => setUserName(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && handleNameSubmit()}
                placeholder="Je volledige naam"
                style={styles.input}
              />
              <button
                onClick={handleNameSubmit}
                disabled={!userName.trim()}
                style={{
                  ...styles.button,
                  background: userName.trim() ? 'linear-gradient(135deg, #22c55e 0%, #10b981 100%)' : 'rgba(255, 255, 255, 0.1)',
                  opacity: userName.trim() ? 1 : 0.5,
                  cursor: userName.trim() ? 'pointer' : 'not-allowed'
                }}
              >
                Start Training →
              </button>
            </div>
          </div>
        );
      }

      return (
        <div style={styles.container}>
          {/* Header */}
          <div style={{ maxWidth: '1200px', margin: '0 auto 3rem', textAlign: 'center' }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: '0.75rem', background: 'rgba(34, 197, 94, 0.1)', border: '1px solid rgba(34, 197, 94, 0.3)', borderRadius: '2rem', padding: '0.5rem 1.5rem', marginBottom: '1.5rem' }}>
              <Award size={20} color="#22c55e" />
              <span style={{ color: '#22c55e', fontSize: '0.875rem', fontWeight: '600' }}>FavorCool Inbound Academy</span>
            </div>
            <h1 style={{ fontSize: '3rem', fontWeight: '800', background: 'linear-gradient(135deg, #ffffff 0%, #94a3b8 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', marginBottom: '1rem' }}>
              Inbound Learning Path
            </h1>
            <p style={{ fontSize: '1.125rem', color: '#94a3b8' }}>
              {Math.round(totalDuration / 60)} uur training • Ingelogd als: {userName}
            </p>
          </div>

          {/* Progress */}
          <div style={{ maxWidth: '1200px', margin: '0 auto 3rem', background: 'rgba(255, 255, 255, 0.05)', borderRadius: '1.5rem', padding: '2rem', border: '1px solid rgba(255, 255, 255, 0.1)' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
              <div>
                <h2 style={{ fontSize: '1.5rem', fontWeight: '700', color: '#ffffff', marginBottom: '0.5rem' }}>Jouw Voortgang</h2>
                <p style={{ color: '#94a3b8', fontSize: '0.875rem' }}>{completedModules} van {totalModules} modules voltooid</p>
              </div>
              <div style={{ fontSize: '3rem', fontWeight: '800', color: '#22c55e' }}>{progressPercentage}%</div>
            </div>
            <div style={{ width: '100%', height: '12px', background: 'rgba(255, 255, 255, 0.1)', borderRadius: '1rem', overflow: 'hidden' }}>
              <div style={{ width: `${progressPercentage}%`, height: '100%', background: 'linear-gradient(90deg, #22c55e 0%, #10b981 100%)', borderRadius: '1rem', transition: 'width 0.6s', boxShadow: '0 0 20px rgba(34, 197, 94, 0.5)' }} />
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1rem', marginTop: '1.5rem' }}>
              {[
                { icon: Clock, value: totalDuration + ' min', label: 'Totale Tijd', color: '#60a5fa' },
                { icon: BookOpen, value: totalModules, label: 'Modules', color: '#f59e0b' },
                { icon: CheckCircle, value: completedModules, label: 'Voltooid', color: '#22c55e' }
              ].map((stat, i) => (
                <div key={i} style={{ background: 'rgba(255, 255, 255, 0.05)', borderRadius: '1rem', padding: '1rem', textAlign: 'center' }}>
                  <stat.icon size={24} color={stat.color} style={{ marginBottom: '0.5rem' }} />
                  <div style={{ fontSize: '1.5rem', fontWeight: '700', color: '#ffffff' }}>{stat.value}</div>
                  <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>{stat.label}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Modules */}
          <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
            {modules.map((module, idx) => {
              const isCompleted = progress[module.id]?.completed;
              const isExpanded = expandedModule === module.id;
              const isQuizActive = currentQuiz === module.id;
              const canStart = idx === 0 || progress[modules[idx - 1].id]?.completed;

              return (
                <div key={module.id} style={{ position: 'relative', marginBottom: '2rem' }}>
                  {idx < modules.length - 1 && (
                    <div style={{ position: 'absolute', left: '2rem', top: '5rem', width: '2px', height: 'calc(100% + 2rem)', background: isCompleted ? 'linear-gradient(180deg, #22c55e 0%, rgba(34, 197, 94, 0.3) 100%)' : 'rgba(255, 255, 255, 0.1)', transition: 'background 0.3s' }} />
                  )}
                  <div style={{ background: isCompleted ? 'linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(34, 197, 94, 0.05) 100%)' : 'rgba(255, 255, 255, 0.05)', borderRadius: '1.5rem', border: isCompleted ? '1px solid rgba(34, 197, 94, 0.3)' : '1px solid rgba(255, 255, 255, 0.1)', overflow: 'hidden', opacity: canStart ? 1 : 0.6 }}>
                    <div onClick={() => canStart && setExpandedModule(isExpanded ? null : module.id)} style={{ padding: '2rem', cursor: canStart ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', gap: '1.5rem' }}>
                      <div style={{ width: '4rem', height: '4rem', borderRadius: '50%', background: isCompleted ? 'linear-gradient(135deg, #22c55e 0%, #10b981 100%)' : 'rgba(255, 255, 255, 0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1 }}>
                        {isCompleted ? <CheckCircle size={28} color="#ffffff" /> : <Circle size={28} color="#94a3b8" />}
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '0.5rem' }}>
                          <span style={{ fontSize: '0.875rem', fontWeight: '600', color: '#60a5fa', background: 'rgba(96, 165, 250, 0.1)', padding: '0.25rem 0.75rem', borderRadius: '0.5rem' }}>Module {module.id}</span>
                          <span style={{ fontSize: '0.875rem', color: '#94a3b8', display: 'flex', alignItems: 'center', gap: '0.25rem' }}>
                            <Clock size={14} /> {module.duration}
                          </span>
                        </div>
                        <h3 style={{ fontSize: '1.5rem', fontWeight: '700', color: '#ffffff', marginBottom: '0.75rem' }}>{module.title}</h3>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                          {module.topics.map((topic, i) => (
                            <span key={i} style={{ fontSize: '0.75rem', color: '#94a3b8', background: 'rgba(255, 255, 255, 0.05)', padding: '0.25rem 0.75rem', borderRadius: '0.5rem' }}>{topic}</span>
                          ))}
                        </div>
                      </div>
                      {canStart && (isExpanded ? <ChevronDown size={24} color="#94a3b8" /> : <ChevronRight size={24} color="#94a3b8" />)}
                    </div>
                    {isExpanded && (
                      <div style={{ padding: '0 2rem 2rem', animation: 'slideDown 0.3s ease-out' }}>
                        {!isQuizActive ? (
                          <>
                            <div style={{ background: 'rgba(0, 0, 0, 0.2)', borderRadius: '1rem', padding: '2rem', marginBottom: '1.5rem', whiteSpace: 'pre-line', lineHeight: '1.8', color: '#e2e8f0', fontSize: '0.9375rem' }}>
                              {module.content}
                            </div>
                            <button onClick={() => setCurrentQuiz(module.id)} style={{ background: 'linear-gradient(135deg, #22c55e 0%, #10b981 100%)', color: '#ffffff', border: 'none', borderRadius: '0.75rem', padding: '1rem 2rem', fontSize: '1rem', fontWeight: '600', cursor: 'pointer', width: '100%', boxShadow: '0 10px 30px rgba(34, 197, 94, 0.3)' }}>
                              Start Quiz →
                            </button>
                          </>
                        ) : (
                          <div>
                            <h4 style={{ fontSize: '1.25rem', fontWeight: '700', color: '#ffffff', marginBottom: '1.5rem' }}>Quick Quiz - {module.title}</h4>
                            {module.quiz.questions.map((q, qIdx) => (
                              <div key={qIdx} style={{ background: 'rgba(0, 0, 0, 0.2)', borderRadius: '1rem', padding: '1.5rem', marginBottom: '1rem' }}>
                                <p style={{ color: '#ffffff', fontWeight: '600', marginBottom: '1rem' }}>{qIdx + 1}. {q.q}</p>
                                {q.options.map((opt, oIdx) => (
                                  <label key={oIdx} style={{ display: 'block', padding: '0.75rem', marginBottom: '0.5rem', background: quizAnswers[qIdx] === oIdx ? 'rgba(34, 197, 94, 0.2)' : 'rgba(255, 255, 255, 0.05)', borderRadius: '0.5rem', cursor: 'pointer', border: `1px solid ${quizAnswers[qIdx] === oIdx ? 'rgba(34, 197, 94, 0.5)' : 'transparent'}` }}>
                                    <input type="radio" name={`q${qIdx}`} checked={quizAnswers[qIdx] === oIdx} onChange={() => setQuizAnswers(prev => ({ ...prev, [qIdx]: oIdx }))} style={{ marginRight: '0.75rem' }} />
                                    <span style={{ color: '#e2e8f0' }}>{opt}</span>
                                  </label>
                                ))}
                              </div>
                            ))}
                            <div style={{ display: 'flex', gap: '1rem' }}>
                              <button onClick={() => submitQuiz(module.id)} disabled={Object.keys(quizAnswers).length !== module.quiz.questions.length} style={{ flex: 1, background: Object.keys(quizAnswers).length === module.quiz.questions.length ? 'linear-gradient(135deg, #22c55e 0%, #10b981 100%)' : 'rgba(255, 255, 255, 0.1)', color: '#ffffff', border: 'none', borderRadius: '0.75rem', padding: '1rem', fontSize: '1rem', fontWeight: '600', cursor: Object.keys(quizAnswers).length === module.quiz.questions.length ? 'pointer' : 'not-allowed', opacity: Object.keys(quizAnswers).length === module.quiz.questions.length ? 1 : 0.5 }}>
                                Submit Quiz
                              </button>
                              <button onClick={() => setCurrentQuiz(null)} style={{ background: 'rgba(255, 255, 255, 0.1)', color: '#94a3b8', border: 'none', borderRadius: '0.75rem', padding: '1rem 1.5rem', fontSize: '1rem', fontWeight: '600', cursor: 'pointer' }}>
                                Terug
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {progressPercentage === 100 && (
            <div style={{ maxWidth: '1200px', margin: '3rem auto', background: 'linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(34, 197, 94, 0.1) 100%)', border: '2px solid rgba(34, 197, 94, 0.5)', borderRadius: '1.5rem', padding: '3rem', textAlign: 'center' }}>
              <Award size={64} color="#22c55e" style={{ marginBottom: '1rem' }} />
              <h2 style={{ fontSize: '2rem', fontWeight: '800', color: '#ffffff', marginBottom: '0.5rem' }}>Gefeliciteerd! 🎉</h2>
              <p style={{ fontSize: '1.125rem', color: '#94a3b8' }}>Je hebt de FavorCool Inbound Learning Path succesvol afgerond!</p>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<LearningPath />, document.getElementById('root'));
  </script>
</body>
</html>
